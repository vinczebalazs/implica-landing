<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting… — Implica</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <link rel="stylesheet" href="styles.css" />

    <script src="analytics.js"></script>

    <!-- Universal download link (e.g. QR codes): sends iOS to the App Store,
         Android to Play, and desktop back to the homepage. Runs blocking, as
         early as possible, so the redirect fires before anything paints. -->
    <script src="download.js"></script>
    <script>
      (function () {
        // Ad conversion tracking, mirrors implica-web's /download-app: fire
        // and forget with keepalive so the request survives the redirect
        // below.
        fetch("/api/capi", {
          method: "POST",
          keepalive: true,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            eventSourceUrl: window.location.href,
            fbp: document.cookie.match(/(?:^|;\s*)_fbp=([^;]*)/)?.[1] ?? null,
            fbc: document.cookie.match(/(?:^|;\s*)_fbc=([^;]*)/)?.[1] ?? null,
          }),
        }).catch(function () {});

        var stores = window.ImplicaStores;
        var platform = stores.detectPlatform();
        var dest =
          platform === "ios" ? stores.IOS_URL : platform === "android" ? stores.ANDROID_URL : "/";

        // PostHog conversion tracking, same reasoning as the Facebook call
        // above: analytics.js only queues posthog.capture() calls until its
        // real library finishes loading in the background, and the redirect
        // fires long before that happens for iOS/Android taps — so the queued
        // call would just be lost with the tab. Posting straight to PostHog's
        // HTTP capture endpoint with keepalive survives the redirect instead.
        // UTM params are pulled off the URL by hand because we're bypassing
        // the library, which is what normally attaches them automatically.
        (function () {
          var PH_KEY = "phc_24Ns2up7p5rSlmBpACzKd66vBZ83Z6WMaUqPeLSC1hx";
          var STORAGE_KEY = "ph_" + PH_KEY + "_posthog";
          var distinctId;
          try {
            distinctId = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null")?.distinct_id;
          } catch (e) {}
          if (!distinctId) {
            distinctId =
              window.crypto && crypto.randomUUID
                ? crypto.randomUUID()
                : "anon-" + Date.now() + "-" + Math.random().toString(36).slice(2);
            // Stored under the same key posthog-js uses, so if its library
            // does finish loading (the desktop fallback stays on-site long
            // enough for that) it reuses this id instead of minting a second
            // one for the same visit.
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify({ distinct_id: distinctId }));
            } catch (e) {}
          }

          var properties = { $current_url: window.location.href, platform: platform };
          new URLSearchParams(window.location.search).forEach(function (value, key) {
            if (key.indexOf("utm_") === 0) properties[key] = value;
          });

          fetch("https://t.implica.app/capture/", {
            method: "POST",
            keepalive: true,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              api_key: PH_KEY,
              event: "download_redirect",
              distinct_id: distinctId,
              properties: properties,
            }),
          }).catch(function () {});
        })();

        window.location.replace(dest);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/" /></noscript>
  </head>
  <body id="top">
    <div class="page">
      <main id="main">
        <section class="redirect-screen">
          <img src="assets/icon.png" alt="" width="56" height="56" class="redirect-icon" />
          <p class="redirect-text">Taking you to the app…</p>
          <div class="redirect-actions">
            <a class="btn btn-gold btn-lg" href="https://apps.apple.com/app/id6759221897"
              >Download for iPhone</a
            >
            <a
              class="btn btn-ghost btn-lg"
              href="https://play.google.com/store/apps/details?id=com.flystraightai.implica"
              >Get it on Android</a
            >
          </div>
          <a class="redirect-home" href="/">Or visit implica.app</a>
        </section>
      </main>
    </div>

    <style>
      .redirect-screen {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 40px;
        text-align: center;
      }
      .redirect-icon {
        border-radius: 22%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }
      .redirect-text {
        font-family: var(--sans);
        color: var(--muted);
        font-size: 15px;
      }
      .redirect-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }
      .redirect-home {
        margin-top: 12px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--dim);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .redirect-home:hover {
        color: var(--muted);
      }
    </style>
  </body>
</html>
